<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Beyond100 Admin</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#12261f;--mut:#5c6b64;--line:#d9d4c4;--g:#0f3d2e;--v:#d9f23d;--bad:#b3261e;--ok:#1b7a43}
@media(prefers-color-scheme:dark){:root{--bg:#0b1f18;--card:#10291f;--ink:#f1ecdc;--mut:#9db0a7;--line:#254538;--g:#d9f23d;--v:#d9f23d;--bad:#ff8a80;--ok:#7be0a0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font:700 18px Georgia,serif;letter-spacing:.12em}header small{color:var(--mut);margin-left:auto}
nav{display:flex;gap:6px;padding:10px 16px;overflow:auto;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on,button.pri{background:var(--g);color:var(--bg);border-color:var(--g)}
@media(prefers-color-scheme:dark){button.on,button.pri{color:#0b1f18}}
button:disabled{opacity:.5}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.card h3{margin:0 0 6px;font-size:16px}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--g);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;max-width:90vw;z-index:9}
@media(prefers-color-scheme:dark){#msg{color:#0b1f18}}
.hide{display:none}
.sport{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}.sport button{border:0;border-radius:999px;padding:5px 14px;background:none}.sport button.on{background:var(--g);color:var(--bg)}
@media(prefers-color-scheme:dark){.sport button.on{color:#0b1f18}}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px}
</style>
</head>
<body>
<header><b>BEYOND100</b><span>Admin</span><span class="sport" id="sport"><button data-s="tenis">Ténis</button><button data-s="padel">Padel</button></span><small id="who">…</small></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="msg"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
try{localStorage.setItem("b100_owner","1")}catch(e){}
// o mesmo molde nas duas vertentes: Estado · Posts · Visitas · Definições, e depois o que é só de uma delas
const TABS_T=[["estado","Estado"],["posts","Posts"],["newsletter","Newsletter"],["visitas","Visitas"],["google","Google"],["defs","Definições"],["fotos","Fotos"],["noticias","Notícias"],["jogos","Jogos"],["handles","Perfis"],["cats","Categorias"],["acoes","Ações"]];
const TABS_P=[["estado","Estado"],["posts","Posts"],["newsletter","Newsletter"],["visitas","Visitas"],["google","Google"],["defs","Definições"],["fotos","Fotos"]];
let _h=(location.hash||"#tenis/estado").slice(1).split("/"), sport=(_h[0]==="padel"?"padel":"tenis"), tab=_h[1]||"estado", cache={};
if(_h.length===1&&_h[0]==="padel"){sport="padel";tab="estado"}
if(sport==="padel"&&tab==="padel")tab="estado";
const TABS=()=>sport==="padel"?TABS_P:TABS_T;
function toast(t,bad){const m=$("#msg");m.textContent=t;m.style.background=bad?"#b3261e":"";m.style.color=bad?"#fff":"";m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",bad?7000:3500)}
async function api(path,opt={}){
  const o={...opt,headers:{"X-Admin":"1","Content-Type":"application/json"}};
  if(o.body&&typeof o.body!=="string")o.body=JSON.stringify(o.body);
  const r=await fetch("/admin-api/"+path,o);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||("Erro "+r.status));return j}
async function readFile(n){const j=await api("file?name="+n);return{data:JSON.parse(j.content||"null"),sha:j.sha}}
async function saveFile(n,data,sha){return api("file",{method:"PUT",body:{name:n,content:JSON.stringify(data),sha}})}
async function run(workflow,inputs){await api("run",{method:"POST",body:{workflow,inputs:inputs||{}}});toast("Iniciado no GitHub ("+workflow+"). Demora 1–3 min.")}

function nav(){ if(!TABS().some(([k])=>k===tab))tab=TABS()[0][0];
  $("#nav").innerHTML=TABS().map(([k,l])=>`<button class="${k===tab?"on":""}" data-t="${k}">${l}</button>`).join("");
  $("#sport").querySelectorAll("button").forEach(b=>b.className=b.dataset.s===sport?"on":"");
  $("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;location.hash=sport+"/"+tab;show()}};
  $("#sport").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.s!==sport){sport=b.dataset.s;tab=TABS()[0][0];location.hash=sport+"/"+tab;show()}}}
async function show(){nav();$("#main").innerHTML='<p class="mut">A carregar…</p>';
  const F=sport==="padel"?{estado:padelEstado,posts:padelPosts,newsletter,fotos:padelFotos,visitas,google,defs}:{estado,posts:tenisPosts,newsletter,fotos:tenisFotos,noticias,visitas,google,jogos,handles,cats,acoes,defs};
  try{await (F[tab]||F.estado)()}catch(e){$("#main").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}}

setInterval(()=>{if(tab==="estado"&&sport!=="padel"&&!document.hidden){estado().catch(()=>{})}},15000);

// ---------- peças comuns (ténis e padel) ----------
const fmtTs=t=>t?new Date(t).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const stTag=p=>p.skipped?`<span class="tag">não saiu (${esc(p.skipped)})</span>`:p.sent?`<span class="tag ok">publicado ${esc(p.when||"")}</span>`:`<span class="tag" style="background:var(--v);color:#0e3a2d">na fila</span>`;
function postsCard(title,items,note){   // items: {img, kind, label, sub, score, sent, skipped, when, link}
  const rows=items.slice(0,80).map(p=>`<tr><td><a href="${esc(p.link||p.img)}" target="_blank" rel="noopener"><img src="${esc(p.img)}" alt="" width="54" height="68" style="border-radius:6px;object-fit:cover" loading="lazy"></a></td>
    <td><b>${esc(p.kind)}</b>${p.score!=null&&p.score!==""?` <span class="mut">interesse ${esc(p.score)}</span>`:""}<br>${esc(p.label||"")}${p.sub?`<br><span class="mut">${p.sub}</span>`:""}</td><td>${stTag(p)}${p.id&&p.sent&&!p.skipped?`<br><button class="arch" data-id="${esc(p.id)}" style="margin-top:6px;font-size:12px;padding:4px 9px">${p.archived?"Arquivado ✓ (desfazer)":"Arquivei"}</button>`:""}</td></tr>`).join("");
  const q=items.filter(p=>!p.sent&&!p.skipped).length,sent=items.filter(p=>p.sent&&!p.skipped).length;
  return `<div class="card"><h3>${esc(title)}</h3><p class="mut">${q} na fila · ${sent} publicados${note?" · "+note:""}</p>${rows?`<table>${rows}</table>`:'<p class="mut">Ainda sem posts.</p>'}</div>`}
function nextCard(title,rows,head){   // rows: {img, kind, label, when, now(bool), why}
  const r=rows.map((p,i)=>`<tr><td><img src="${esc(p.img)}" alt="" width="46" height="58" style="border-radius:6px;object-fit:cover" loading="lazy"></td>
    <td>${p.now&&!rows.slice(0,i).some(x=>x.now)?'<span class="tag" style="background:var(--v);color:#0e3a2d">próximo</span> ':""}<b>${esc(p.kind)}</b>${p.score?` <span class="mut">interesse ${esc(p.score)}</span>`:""}<br>${esc(p.label||"")}<br><span class="${p.now?"ok":"mut"}">${esc(p.why)}</span></td></tr>`).join("");
  return `<div class="card" style="border:2px solid var(--v)"><h3>${esc(title)}</h3><p class="mut">${head}</p>${r?`<table>${r}</table>`:'<p class="mut">Nada na fila neste momento.</p>'}</div>`}
const lisbonNow=()=>{const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Lisbon",hour:"2-digit",minute:"2-digit",year:"numeric",month:"2-digit",day:"2-digit",hour12:false}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return {day:`${g("year")}-${g("month")}-${g("day")}`,h:+g("hour")%24,m:+g("minute")}};
const hm=t=>new Date(t).toLocaleTimeString("pt-PT",{timeZone:"Europe/Lisbon",hour:"2-digit",minute:"2-digit"});
function runsCard(runs){return `<div class="card"><h3>Últimas execuções</h3><table>${runs.map(r=>`<tr><td>${esc(r.name)}</td><td class="${r.conclusion==="success"?"ok":r.conclusion?"bad":""}">${esc(r.conclusion||r.status)}</td><td class="mut">${new Date(r.at).toLocaleString("pt-PT")}</td><td><a href="${esc(r.url)}" target="_blank" rel="noopener">ver</a></td></tr>`).join("")}</table></div>`}
function pubCard(name,handle,on,how,site){return `<div class="card"><h3>Publicação no ${esc(handle)}: ${on?'<span class="ok">ligada</span>':'<span class="bad">desligada</span>'}</h3><p class="mut">${how}</p><p><a href="${esc(site)}" target="_blank" rel="noopener">Abrir o site ↗</a> · <a href="https://www.instagram.com/${esc(handle.replace("@",""))}/" target="_blank" rel="noopener">Instagram ↗</a></p></div>`}

async function tenisPosts(){
  const [pf,cf,rf,af]=await Promise.all([readFile("posts.json").catch(()=>({data:{}})),readFile("carousels.json").catch(()=>({data:[]})),readFile("results.json").catch(()=>({data:[]})),readFile("archived_posts.json").catch(()=>({data:[],sha:null}))]);
  const ARCH=new Set((af.data||[]).map(String));
  const R={};(rf.data||[]).forEach(r=>{R[String(r.id)]=r});
  const KIND={news:"Notícia",preview:"Antevisão",final:"Resultado"};
  const items=[];
  Object.keys(pf.data||{}).sort().reverse().forEach(d=>(pf.data[d]||[]).slice().reverse().forEach(e=>{
    const id=String(e.id),r=R[id],rs=e.reasons||[];
    const SP={"news-road":"Road to the Top 100","news-power":"Power Ranking","news-records":"Recordes do mês","news-hist":"This week in history","news-rising":"Rising"};
    const spk=Object.keys(SP).find(p=>id.startsWith(p+"-"));
    const k=spk?"Lista semanal":id.startsWith("news-")?"Notícia":id.startsWith("preview-")?"Antevisão":rs.includes("final")?"Título":rs.includes("upset")?"Surpresa":"Resultado";
    let label="",sub="";
    if(r){const w=r["p"+r.winner]||{},l=r["p"+(3-r.winner)]||{},g=r.games||[[],[]],sc=(g[r.winner-1]||[]).map((x,i)=>x+"-"+(g[2-r.winner]||[])[i]).join(" ");
      const why=rs.filter(x=>!["tour","challenger","itf","no-story"].includes(x)).join(", ");
      label=`${w.name||""} d. ${l.name||""} ${sc}`;sub=[esc(r.tournament||""),esc(r.round||""),esc(why)].filter(Boolean).join(" · ")}
    else if(spk){label=SP[spk]+" · "+id.slice(spk.length+1);sub=esc(d)}
    else{label=id.replace(/^(news|preview)-\d{4}-\d{2}-\d{2}-?/,"").replace(/-/g," ");label=label.replace(/\b\w/g,c=>c.toUpperCase());sub=esc(d)}
    const img=e.image?"/posts/"+e.image:"";
    items.push({img,link:img,kind:k,label,sub:sub+(e.image?` · <a href="/posts/${esc(e.image.replace(/\.jpg$/,".txt"))}" target="_blank" rel="noopener">legenda</a>`:""),id:String(e.id),archived:ARCH.has(String(e.id)),score:e.score===99?"":e.score,sent:e.sent,skipped:e.skipped,when:e.sent_at?e.sent_at.slice(5).replace("-","/"):""})}));
  const car=(cf.data||[]).slice().reverse().map(c=>({img:"/posts/"+(c.images||[])[0],link:"/posts/"+(c.images||[])[0],kind:"Carrossel ("+(c.images||[]).length+")",label:(c.caption||"").split("\n")[0].slice(0,110),sub:esc(c.id||""),sent:c.sent,when:(c.sent_at||"").slice(5)}));
  if(!cache.vars){cache.vars=await api("vars").catch(()=>({}))}
  const V=cache.vars||{},on=["1","true","yes","on"].includes(String(V.PUBLISH_AUTO||"").toLowerCase());
  // ---- a seguir: as mesmas regras do publisher.py de 9/11/2026 (mantém em sintonia)
  const N=(k,d)=>{const x=parseFloat(V[k]);return isNaN(x)?d:x};
  const dayMax=N("DAY_MAX_POSTS",3),nowSc=N("SEND_NOW_SCORE",12),prevSc=N("PREVIEW_SCORE",9),maxAge=N("RESULT_MAX_AGE_H",16),sFrom=N("SEND_FROM",8),sTo=N("SEND_TO",23);
  const slots=String(V.POST_SLOTS||"13,18,21").split(",").map(Number).filter(x=>!isNaN(x)).sort((a,b)=>a-b),mins=String(V.SLOT_MIN||"10,9,0").split(",").map(Number);
  const L=lisbonNow(),inWin=L.h>=sFrom&&L.h<sTo;
  const all=[];Object.keys(pf.data||{}).forEach(d=>(pf.data[d]||[]).forEach(e=>all.push(e)));
  const isPrev=e=>String(e.id).startsWith("preview-"),isRes=e=>{const id=String(e.id);return !id.startsWith("news-")&&!isPrev(e)};
  const lday=t=>{if(!t)return "";const d=new Date(t.replace(" ","T")+"Z");return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Lisbon"}).format(d)};
  const sentToday=all.filter(e=>e.sent&&!e.skipped&&!ARCH.has(String(e.id))&&lday(e.sent_at)===L.day);
  const carToday=(cf.data||[]).filter(c=>c.sent&&lday(c.sent_at)===L.day).length,dayCount=sentToday.length+carToday;
  const now=Date.now()/1000,pend=all.filter(e=>!e.sent&&!e.skipped&&e.image&&!(e.created&&now-e.created>(isPrev(e)?12:maxAge)*3600));
  const val=e=>isPrev(e)?prevSc:isRes(e)?(e.score||0):(e.score||9);
  const excDone=sentToday.some(e=>isRes(e)&&(e.score||0)>=nowSc);
  const order=pend.slice().sort((a,b)=>val(b)-val(a)||(a.created||0)-(b.created||0));
  const open=slots.filter(h=>L.h>=h).length,cur=open?open-1:null,nextSlot=slots.find(h=>h>L.h),rescue=N("SLOT_RESCUE_MIN",7);
  let bar=cur!=null?(mins[cur]||0):0;if(cur!=null&&cur>=1&&dayCount===0&&bar>rescue)bar=rescue;   // sem posts até às 18h: fasquia desce para 7
  const exp=e=>e.created?" · caduca às "+hm((e.created+(isPrev(e)?12:maxAge)*3600)*1000):"";
  const lab=e=>{const r=R[String(e.id)];if(!r)return String(e.id).replace(/-/g," ");const w=r["p"+r.winner]||{},l=r["p"+(3-r.winner)]||{};return `${w.name} d. ${l.name} · ${r.tournament}`};
  const kindOf=e=>isPrev(e)?"Antevisão":!isRes(e)?"Especial":(e.reasons||[]).includes("final")?"Título":(e.reasons||[]).includes("upset")?"Surpresa":"Resultado";
  let firstRes=true;
  const nxt=order.map(e=>{const v=val(e);let why,now_=false;
    if(dayCount>=dayMax&&!(v>=nowSc&&!excDone))why=`o dia já tem ${dayCount} de ${dayMax}: só um 12+ ainda sairia`;
    else if(!inWin)why=`fora do horário: só a partir das ${sFrom}h`;
    else if(isPrev(e)){why="antevisão: sai na próxima atualização (antes do jogo)";now_=true}
    else if(v>=nowSc){why=`excecional (${nowSc}+): sai na próxima atualização`;now_=true}
    else if(firstRes){firstRes=false;
      if(open&&dayCount<open&&v>=bar){why=`hora de publicação das ${slots[cur]}h: sai na próxima atualização`;now_=true}
      else if(open&&dayCount<open)why=`às ${slots[cur]}h só sai ${bar}+; se nada melhor aparecer, sai ${nextSlot?"às "+nextSlot+"h":"mais tarde"}`;
      else why=nextSlot?`o melhor da fila: sai às ${nextSlot}h se continuar a ser o melhor`:"o melhor da fila, mas as horas de hoje já passaram"}
    else why="em espera: só sai se for dos melhores do dia";
    return {img:"/posts/"+e.image,kind:kindOf(e),label:lab(e),score:isRes(e)?e.score:"",now:now_,why:why+exp(e)}});
  const slotTxt=slots.map((h,k)=>`${h}h (${mins[k]?mins[k]+"+":"o melhor"})`).join(" · ");
  const head=`Agora ${String(L.h).padStart(2,"0")}:${String(L.m).padStart(2,"0")} em Lisboa · publicados hoje: <b>${dayCount} de ${dayMax}</b> (conta tudo, menos os arquivados) · horas: ${slotTxt} · ${nowSc}+ sai logo · sem nenhum post até às ${slots[1]||18}h, a fasquia desce para ${rescue} · resultados caducam ao fim de ${maxAge} h.`;
  $("#main").innerHTML=nextCard("A seguir",nxt,head)+pubCard("ténis","@beyond100.tennis",on,`Muda em Definições (PUBLISH_AUTO). Máximo ${esc(V.MAX_POSTS_PER_DAY||"3")} resultados por dia; títulos, viragens e surpresas primeiro.`,"/index.html")
    +postsCard("Todos os posts",items,"últimos 14 dias · arquivaste um no Instagram? carrega em \"Arquivei\" e deixa de contar para os 3 do dia")+(car.length?postsCard("Carrosséis",car):"");
  $("#main").querySelectorAll("button.arch").forEach(b=>b.onclick=async()=>{b.disabled=true;
    try{const f=await readFile("archived_posts.json").catch(()=>({data:[],sha:null}));const L2=(f.data||[]).map(String),id=b.dataset.id,on=L2.includes(id);
      await saveFile("archived_posts.json",on?L2.filter(x=>x!==id):[...L2,id].slice(-500),f.sha);toast(on?"Voltou a contar.":"Arquivado: deixa de contar para os 3 do dia.");tenisPosts()}
    catch(err){toast(err.message,true);b.disabled=false}})}

async function newsletter(){
  const [sf,runs]=await Promise.all([readFile("newsletter_state.json").catch(()=>({data:{}})),api("runs").catch(()=>[])]);
  const S=sf.data||{},sm=S.summary||{},L=lisbonNow();
  const d=new Date(L.day+"T12:00:00Z"),toSun=(7-d.getUTCDay())%7,sun=new Date(d.getTime()+toSun*864e5),sunTxt=sun.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"});
  const tile=(v,k,sub,bg,fg)=>`<div class="card" style="flex:1;min-width:140px;background:${bg||"var(--card)"};${fg?"color:"+fg+";border-color:"+bg:""}"><div style="font:800 34px/1 system-ui">${v}</div><div style="font-weight:700;margin-top:6px">${k}</div><div style="font-size:13px;opacity:.75">${sub}</div></div>`;
  const nr=(runs||[]).filter(r=>/newsletter/i.test(r.name)).slice(0,3);
  $("#main").innerHTML=`<div class="row" style="align-items:stretch">
    ${tile(S.subscribers??"—","inscritos",S.key?"no Buttondown":"falta a chave BUTTONDOWN_API_KEY","#d9f23d","#0e3a2d")}
    ${tile(S.week?"Semana "+S.week:"—","última gerada",S.built_at?"às "+esc(fmtTs(S.built_at.replace(" ","T")+"Z")):"ainda não gerada")}
    ${tile(S.draft?esc(S.draft.replace(/^\d{4}-W/,"Semana ")):"—",S.sent?"última enviada":"último rascunho",S.draft_at?esc(fmtTs(S.draft_at.replace(" ","T")+"Z")):"nenhum ainda")}</div>
  <div class="card"><h3>Como funciona</h3><p class="mut">A newsletter é refeita a cada atualização completa com os dados da semana (0 pedidos à API de ténis). No domingo a partir das 19h (próximo: <b>${esc(sunTxt)}</b>) é <b>enviada sozinha</b> aos inscritos pelo Buttondown. Só fica em rascunho se a semana tiver poucos dados (menos de 30 resultados ou nenhum campeão).</p>
    <p class="mut">Esta semana: ${sm.results??"—"} resultados · ${sm.champions??"—"} campeões · ${sm.upsets??"—"} surpresas · ${sm.padel??"—"} campeões de padel.</p>
    <div class="row"><button class="pri" id="nlTest">Criar rascunho de teste agora</button><a href="https://buttondown.com/emails" target="_blank" rel="noopener"><button>Abrir o Buttondown ↗</button></a><a href="/newsletter/latest.html" target="_blank" rel="noopener"><button>Abrir em ecrã inteiro ↗</button></a></div>
    <p class="mut">O teste cria um rascunho "[TEST]" (não é enviado e não conta para domingo). Para o receberes no teu email, abre-o no Buttondown e carrega em "Send test email".</p>
    ${nr.length?`<table>${nr.map(r=>`<tr><td>${esc(r.name)}</td><td class="${r.conclusion==="success"?"ok":r.conclusion?"bad":""}">${esc(r.conclusion||r.status)}</td><td class="mut">${new Date(r.at).toLocaleString("pt-PT")}</td><td><a href="${esc(r.url)}" target="_blank" rel="noopener">ver</a></td></tr>`).join("")}</table>`:""}</div>
  <div class="card" style="padding:0;overflow:hidden"><iframe src="/newsletter/latest.html" title="Pré-visualização" style="width:100%;height:1100px;border:0;display:block;background:#03110c"></iframe></div>`;
  $("#nlTest").onclick=async e=>{e.target.disabled=true;try{await api("run",{method:"POST",body:{workflow:"newsletter.yml",inputs:{}}});toast("A criar o rascunho de teste (1–2 min)…")}catch(err){toast(err.message,true);e.target.disabled=false}}}

async function padelEstado(){
  const [st,runs]=await Promise.all([readFile("padel/data/state.json").catch(()=>({data:{}})),api("runs").catch(()=>[])]);

async function padelPosts(){

  const label=e=>{const f=e.facts||{};if(e.kind==="intro")return "Post de apresentação "+e.n;if(f.finals)return f.finals.map(x=>x.category+": "+(x.winners||[]).map(p=>p.name).join(" / ")+" "+x.score).join(" · ");if(e.kind==="result")return (f.winners||[]).map(p=>p.name).join(" / ")+" d. "+(f.losers||[]).map(p=>p.name).join(" / ")+" "+(f.score||"");if(e.kind==="preview")return (f.pair_1||[]).join(" / ")+" vs "+(f.pair_2||[]).join(" / ");return (f.feature||"")+(f.category?" · "+f.category:"")};
  const items=((q.data||{}).queue||[]).slice().reverse().map(e=>{const f=e.facts||{};return {img:"/posts/"+e.image,link:"/posts/"+e.image,kind:f.finals?"Campeões":(KIND[e.kind]||e.kind),label:label(e),
    sub:f.tournament?esc(f.tournament)+" · "+esc(f.round||""):"",score:e.score||"",sent:e.sent,skipped:e.skipped,when:e.sent_ts?fmtTs(e.sent_ts*1000):""}});
  if(!cache.vars){cache.vars=await api("vars").catch(()=>({}))}
  const V=cache.vars||{},on=["1","true","yes","on"].includes(String(V.PADEL_PUBLISH||"").toLowerCase());
  // ---- a seguir: as mesmas regras do padel/posts.py send()
  const N=(k,d)=>{const x=parseFloat(V[k]);return isNaN(x)?d:x};
  const sFrom=N("PADEL_SEND_FROM",9),sTo=N("PADEL_SEND_TO",23),maxD=N("PADEL_MAX_POSTS_PER_DAY",4),L=lisbonNow(),inWin=L.h>=sFrom&&L.h<sTo;
  const Qa=(q.data||{}).queue||[],day0=new Date(L.day+"T00:00:00").getTime()/1000;
  const resToday=Qa.filter(e=>e.kind==="result"&&e.sent&&!e.skipped&&(e.sent_ts||0)>=day0).length;
  const pend=Qa.filter(e=>!e.sent&&!(e.kind==="result"&&Date.now()/1000-e.created>20*3600));
  const ORD={intro:0,preview:1,weekly:2,result:3};
  pend.sort((a,b)=>(ORD[a.kind]-ORD[b.kind])||(a.kind==="intro"?a.n-b.n:(b.score||0)-(a.score||0)));
  const nxt=pend.map(e=>{const full=e.kind==="result"&&resToday>=maxD,exp=e.kind==="result"?" · expira às "+hm((e.created+20*3600)*1000):"";
    return {img:"/posts/"+e.image,kind:(e.facts||{}).finals?"Campeões":(KIND[e.kind]||e.kind),label:label(e),score:e.score||"",now:inWin&&!full,
      why:(!inWin?`fora do horário: só a partir das ${sFrom}h`:full?`limite do dia cheio (${maxD} resultados)`:"pode sair já")+exp}});
  const head=`Agora ${String(L.h).padStart(2,"0")}:${String(L.m).padStart(2,"0")} em Lisboa · resultados publicados hoje: <b>${resToday}</b> (limite ${maxD}) · horário ${sFrom}h–${sTo}h · 1 post por atualização (às :07), apresentação → antevisões → listas semanais → resultados (maior interesse primeiro).`;
  $("#main").innerHTML=nextCard("A seguir",nxt,head)+pubCard("padel","@beyond100.padel",on,`Muda em Definições → Padel (PADEL_PUBLISH). Máximo ${esc(V.PADEL_MAX_POSTS_PER_DAY||"4")} resultados por dia.`,"/padel/index.html")+postsCard("Todos os posts",items)}

  const known=new Set(G.flatMap(g=>g[1].map(f=>f[0])));
  const extra=Object.keys(v).filter(k=>!known.has(k)).map(k=>[k,"x","",k,""]);
  if(extra.length)G.push(["Outras",extra]);
  const isOn=(x,d)=>{x=String(x).trim().toLowerCase();return d==="1"?!["0","no","off","false"].includes(x):["1","true","yes","on"].includes(x)};
  const field=([k,t,d,l,h,opts])=>{const cur=v[k]??"",set=cur!=="";let ctl;
    if(t==="b")ctl=`<label class="sw"><input type="checkbox" data-b="${k}" ${isOn(set?cur:d,d)?"checked":""}><span>${isOn(set?cur:d,d)?"Ligado":"Desligado"}</span></label>`;
    else if(t==="s")ctl=`<select data-n="${k}"><option value="">Por omissão (${esc((opts.find(o=>o[0]===d)||[d,d])[1])})</option>${set&&!opts.some(o=>o[0]===cur)?`<option value="${esc(cur)}" selected>${esc(cur)} (atual)</option>`:""}${opts.map(o=>`<option value="${o[0]}" ${set&&cur===o[0]?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
    else ctl=`<input data-n="${k}" value="${esc(cur)}" placeholder="${d===""?"vazio":esc(d)}" style="width:${t==="n"?90:200}px" ${t==="n"?'inputmode="decimal"':""}><button data-s="${k}">Guardar</button>`;
    return `<div class="fld"><div class="fl"><b>${esc(l)}</b>${h?` <button class="hq" data-h="${k}" aria-label="Ajuda">?</button>`:""}<br><span class="mut">${k}${d!==""?` · omissão ${esc((opts&&(opts.find(o=>o[0]===d)||[])[1])||d)}`:""}${set&&t!=="b"?"":set?" · definido":""}</span>${h?`<p class="hp" id="h-${k}" hidden>${esc(h)}</p>`:""}</div><div class="fc">${ctl}${set?`<button class="rs" data-r="${k}" title="Repor o valor por omissão">↺</button>`:""}</div></div>`};
  $("#main").innerHTML=`<style>.fld{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.fld:last-child{border:0}.fl{flex:1;min-width:0}.fc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.hq{padding:0;width:22px;height:22px;border-radius:50%;font-size:12px;line-height:1}.hp{margin:6px 0 0;font-size:13px;color:var(--mut);max-width:560px}.rs{padding:5px 9px}.sw{display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}.sw input{width:20px;height:20px;accent-color:var(--g)}@media(max-width:600px){.fld{flex-direction:column}.fc{justify-content:flex-start}}</style>
   <p class="mut">Vazio = valor por omissão do código. Toca no <b>?</b> para ver o que cada definição faz. As caixas guardam logo ao clicar.</p>
   ${G.filter(([t])=>(sport==="padel")===t.startsWith("Padel")).map(([t,fs])=>`<div class="card"><h3>${esc(t)}</h3>${fs.map(field).join("")}</div>`).join("")}`;
  const save=async(k,val)=>{try{await api("vars",{method:"PUT",body:{name:k,value:val}});cache.vars=null;toast(val===""?k+" reposto.":k+" guardado.");if(val==="")defs()}catch(err){toast(err.message,true)}};
  $("#main").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.h){const p=$("#h-"+b.dataset.h);p.hidden=!p.hidden;return}
    if(b.dataset.r){if(confirm("Repor "+b.dataset.r+" no valor por omissão?"))save(b.dataset.r,"");return}
    if(b.dataset.s)save(b.dataset.s,$(`[data-n="${b.dataset.s}"]`).value.trim())};
  $("#main").onchange=e=>{const t=e.target;
    if(t.dataset.b){t.nextElementSibling.textContent=t.checked?"Ligado":"Desligado";save(t.dataset.b,t.checked?"1":"0")}
    else if(t.tagName==="SELECT"&&t.dataset.n)save(t.dataset.n,t.value)};
  $("#main").onkeydown=e=>{if(e.key==="Enter"&&e.target.dataset.n)save(e.target.dataset.n,e.target.value.trim())}}


api("me").then(m=>{$("#who").textContent=m.email;show()}).catch(e=>{$("#who").textContent="";$("#main").innerHTML=`<div class="card bad">${esc(e.message)}</div>`});
</script>
</body>
</html>
