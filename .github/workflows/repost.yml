name: Repost match
on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "Numero do jogo a refazer (o que aparece no log, ex.: 209656, ou no site em /m/NUMERO.html)"
        required: true
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Dados (repositório privado) + código (este repositório público)
        uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - name: Código do motor por cima dos dados
        run: |
          rm -rf _engine/.git && tar -C _engine -cf - . | tar -xf - && echo "_engine/" >> .git/info/exclude
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fonts (open licence, for the cards)
        run: |
          mkdir -p fonts
          [ -f fonts/BarlowCondensed-Bold.ttf ] || curl -sSfL -o fonts/BarlowCondensed-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf || echo "fonte não descarregada (usa a de recurso)"
      - run: sudo apt-get install -y fonts-dejavu-core fonts-liberation
      - name: Rebuild the post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPTION_WEB_CONTEXT: ${{ vars.CAPTION_WEB_CONTEXT }}
          CAPTION_MODEL: ${{ vars.CAPTION_MODEL }}
          CAPTION_WEB_MIN_SCORE: ${{ vars.CAPTION_WEB_MIN_SCORE }}
          CARD_STYLE: ${{ vars.CARD_STYLE }}
          PHOTO_GALLERY: ${{ vars.PHOTO_GALLERY }}
          PHOTO_MAX_AGE_Y: ${{ vars.PHOTO_MAX_AGE_Y }}
          CAPTION_LITE_BELOW: ${{ vars.CAPTION_LITE_BELOW }}
          FETCH_PHOTOS: "1"
          ALLOW_SA: ${{ vars.ALLOW_SA }}
          WIKI_CONTACT: ${{ vars.WIKI_CONTACT }}
          REQUIRE_PHOTO: ${{ vars.REQUIRE_PHOTO }}
          POST_LEVELS: ${{ vars.POST_LEVELS }}
        run: |
          python repost.py ${{ github.event.inputs.match_id }}
          python publisher.py prepare out
      - name: Save state
        run: |
          git config user.name "beyond100-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          for f in posts.json spend.json; do if [ -f "$f" ]; then git add -f "$f"; fi; done
          if [ -d posts ]; then git add -A -f posts; fi
          if [ -d photos ]; then git add -A -f photos; fi
          if ! git diff --cached --quiet; then git commit -m "Repost"; git push; fi
      - name: Build site (so the new image is online before sending)
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
          NEWSLETTER_USER: ${{ vars.NEWSLETTER_USER }}
          HISTORY: ${{ vars.HISTORY }}
        run: |
          python result_card.py --page
          python clean_links.py site || echo "links: falhou (ignorado)"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=beyond100
      - name: Send to Instagram (only if PUBLISH_AUTO=1)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPTION_WEB_CONTEXT: ${{ vars.CAPTION_WEB_CONTEXT }}
          CAPTION_MODEL: ${{ vars.CAPTION_MODEL }}
          CAPTION_WEB_MIN_SCORE: ${{ vars.CAPTION_WEB_MIN_SCORE }}
          CAPTION_LITE_BELOW: ${{ vars.CAPTION_LITE_BELOW }}
          PUBLISH_AUTO: ${{ vars.PUBLISH_AUTO }}
          SEND_FROM: "0"
          SEND_TO: "24"
          SEND_GAP_MIN: "0"
          SEND_WEAK_FROM: "0"
          PUBLISH_BACKEND: ${{ vars.PUBLISH_BACKEND }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publisher.py send
      - name: Save sent flag
        run: |
          git add -f posts.json
          if [ -f spend.json ]; then git add -f spend.json; fi
          if ! git diff --cached --quiet; then git commit -m "Repost sent"; git pull --rebase --autostash || true; git push; fi
