name: IG image diag (teste)
on:
  push:
    branches: [proto/ig-diag]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for f in news-power-2026-W48-2026-11-24.jpg; do
            for ua in "Mozilla/5.0" "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "meta-externalagent/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)" "Instagram 219.0.0.12.117 Android" "curl/8"; do
              echo "== $ua"
              curl -s -o /tmp/x -D - -A "$ua" "https://beyond100tennis.com/posts/$f" | grep -iE "^HTTP|content-type|content-length|cf-mitigated|server:|location" 
              head -c 4 /tmp/x | xxd | head -1
            done
          done
          echo "== HEAD"; curl -sI "https://beyond100tennis.com/posts/news-power-2026-W48-2026-11-24.jpg" | head -12
