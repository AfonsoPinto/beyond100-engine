# Reel de exemplo com o vídeo oficial do Red Bull Content Pool (ramo proto/rbcp-reel). Sem IA: só ffmpeg/Python.
# O vídeo final fica no repositório privado (ramo reel-exemplo) para o Afonso ver. Os links nunca aparecem nos registos.
name: RBCP reel example
on:
  push:
    branches: [proto/rbcp-reel]
    paths: [tools/rbcp_reel.py, .github/workflows/rbcp_reel.yml]
permissions:
  contents: read
jobs:
  reel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}", sparse-checkout: rbcp/video_inbox.json, sparse-checkout-cone-mode: false }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Ferramentas
        run: |
          pip install -q pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Vídeo (link do pedido, sem o mostrar)
        run: |
          python - <<'PY'
          import json, urllib.request
          it = json.load(open("rbcp/video_inbox.json"))[0]
          urllib.request.urlretrieve(it["url"], "src.mp4")
          PY
          ls -la src.mp4 | awk '{print $5" bytes"}'
      - name: Montar o Reel
        run: |
          cp -r _engine/fonts . && python _engine/tools/rbcp_reel.py src.mp4 reel.mp4
      - name: Guardar no repositório privado (ramo reel-exemplo)
        run: |
          mkdir out && cd out && git init -q && git checkout -q -b reel-exemplo
          cp ../reel.mp4 reel-exemplo-dubai.mp4
          git config user.name "beyond100-bot" && git config user.email "bot@users.noreply.github.com"
          git add -f reel-exemplo-dubai.mp4 && git commit -q -m "Reel de exemplo (Dubai P1, vídeo RBCP)"
          git push -q -f "https://x-access-token:${{ secrets.DATA_TOKEN }}@github.com/AfonsoPinto/beyond100.git" reel-exemplo
