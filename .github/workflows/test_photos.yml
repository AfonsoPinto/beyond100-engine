name: Test photos
on:
  workflow_dispatch:
    inputs:
      players:
        description: "Jogadores separados por vírgula, opcional. Ex.: Titouan Droguet|2001-06-15, Jacob Fearnley|2001-07-15"
        default: "Titouan Droguet|2001-06-15, Jacob Fearnley|2001-07-15"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Dados (repositório privado) + código (este repositório público)
        uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - name: Código do motor por cima dos dados
        run: |
          rm -rf _engine/.git && tar -C _engine -cf - . | tar -xf - && echo "_engine/" >> .git/info/exclude
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y fonts-dejavu-core fonts-liberation
      - name: Fetch free-licence photos and render sample cards
        env:
          WIKI_CONTACT: ${{ vars.WIKI_CONTACT }}
          ALLOW_SA: ${{ vars.ALLOW_SA }}
          FLICKR_KEY: ${{ secrets.FLICKR_KEY }}
          PLAYERS: ${{ github.event.inputs.players }}
        run: python test_photos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-test
          path: photo_test/
          retention-days: 7
          if-no-files-found: ignore
