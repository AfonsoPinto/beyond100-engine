# Exemplo do Reel "Top 3 points" (ramo proto/top3). Sem IA: só medições de som/cortes (ffmpeg/numpy).
name: Top3 example
on:
  push:
    branches: [proto/top3]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}", sparse-checkout: rbcp/newscut_test.json, sparse-checkout-cone-mode: false }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q pillow numpy
          for i in 1 2 3; do sudo apt-get install -y -qq ffmpeg >/dev/null && break || (sudo apt-get update -qq || true; sleep 10); done
      - name: Vídeo (sem mostrar o link)
        run: python -c "import json,urllib.request;it=json.load(open('rbcp/newscut_test.json'))[0];urllib.request.urlretrieve(it['url'],'src.mp4')"
      - name: Top 3
        run: cp -r _engine/fonts . && PYTHONPATH=_engine python -m reels.rbcp_top3 src.mp4 top3.mp4 "DUBAI P1"
      - name: Guardar no repositório privado (ramo reel-exemplo)
        run: |
          git clone -q --depth 1 -b reel-exemplo "https://x-access-token:${{ secrets.DATA_TOKEN }}@github.com/AfonsoPinto/beyond100.git" out
          cp top3.mp4 out/top3-exemplo-dubai.mp4 && cd out
          git config user.name "beyond100-bot" && git config user.email "bot@users.noreply.github.com"
          git add -f top3-exemplo-dubai.mp4 && git commit -q -m "Top 3 points de exemplo (Dubai P1)" && git push -q origin reel-exemplo
