name: Rebuild stats
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Dados (repositório privado) + código (este repositório público)
        uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - name: Código do motor por cima dos dados
        run: |
          rm -rf _engine/.git && tar -C _engine -cf - . | tar -xf - && echo "_engine/" >> .git/info/exclude
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Rebuild
        run: |
          python rebuild_stats.py
          git config user.name "beyond100-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f stats.json archive.json results.json
          if ! git diff --cached --quiet; then git commit -m "Rebuild stats without qualifying"; git pull --rebase --autostash || true; git push; fi
