name: Padel Flickr/Openverse report
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Dados (repositório privado) + código (este repositório público)
        uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - name: Código do motor por cima dos dados
        run: |
          rm -rf _engine/.git && tar -C _engine -cf - . | tar -xf - && echo "_engine/" >> .git/info/exclude
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Wikidata list (all padel players)
        env:
          WIKI_CONTACT: ${{ secrets.WIKI_CONTACT }}
        run: python padel_photos_report.py
      - name: Flickr + Openverse (free-licence padel photos)
        env:
          FLICKR_KEY: ${{ secrets.FLICKR_KEY }}
          WIKI_CONTACT: ${{ secrets.WIKI_CONTACT }}
        run: python padel_flickr_report.py
      - name: Save the reports
        run: bash _engine/save_state.sh "Padel Flickr report" padel_photos_report.json padel_flickr_report.json
