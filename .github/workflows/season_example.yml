name: Season example
on:
  push:
    branches: [proto/season-probe]
    paths: [season_review.py, .github/workflows/season_example.yml]
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}", sparse-checkout: "photos\nfonts", sparse-checkout-cone-mode: true }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - run: rm -rf _engine/.git && tar -C _engine -cf - . | tar -xf -
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt; for i in 1 2 3; do sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation fonts-inter >/dev/null && break || sleep 10; done
      - run: python season_review.py data && for k in titles first top20 nations numbers; do python season_review.py $k season-$k.png; done
      - name: Guardar no repositório privado (ramo reel-exemplo)
        run: |
          git clone -q --depth 1 -b reel-exemplo "https://x-access-token:${{ secrets.DATA_TOKEN }}@github.com/AfonsoPinto/beyond100.git" out
          cp season-*.png out/ && cd out && git config user.name "beyond100-bot" && git config user.email "bot@users.noreply.github.com"
          git add -f season-*.png && git commit -q -m "Season in review: exemplo" && git push -q origin reel-exemplo
