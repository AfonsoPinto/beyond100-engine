name: Reel quality test
on:
  push:
    branches: [proto/reel-quality]
permissions:
  contents: read
jobs:
  q:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: bacc972d29815d6939cc90be3dcb7f7284899f7f, token: "${{ secrets.DATA_TOKEN }}", sparse-checkout: rbcp/video_inbox.json, sparse-checkout-cone-mode: false }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - run: for i in 1 2 3; do sudo apt-get install -y -qq ffmpeg bc >/dev/null && break || (sudo apt-get update -qq || true; sleep 10); done
      - name: Vídeo (sem mostrar o link)
        run: python3 -c "import json,urllib.request;it=json.load(open('rbcp/video_inbox.json'))[0];urllib.request.urlretrieve(it.get('url') or it.get('downloadURL'),'src.mp4')"
      - run: bash _engine/tools/reel_quality.sh
