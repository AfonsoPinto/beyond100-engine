# Sondagem técnica do Red Bull Content Pool (ramo proto/rbcp; sem login, não descarrega fotos).
name: RBCP probe
on:
  push:
    branches: [proto/rbcp]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python tools/rbcp_probe.py
      - name: Sondagem com login (só corre se os secrets existirem)
        env:
          RBCP_EMAIL: ${{ secrets.RBCP_EMAIL }}
          RBCP_PASSWORD: ${{ secrets.RBCP_PASSWORD }}
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python tools/rbcp_login_probe.py
