# Red Bull Content Pool: busca as fotos pedidas pelo browser (links em rbcp/inbox.json, repositório privado) e guarda-as lá.
name: RBCP fetch (teste)
on:
  push:
    branches: [proto/rbcp]
    paths: [tools/rbcp_fetch.py, .github/workflows/rbcp_fetch.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: engine }
      - uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: rbcp-inbox, token: "${{ secrets.DATA_TOKEN }}", path: data, sparse-checkout: rbcp }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow
      - run: python engine/tools/rbcp_fetch.py data
      - name: Guardar no repositório privado (ramo rbcp-inbox)
        run: |
          cd data && git config user.name "beyond100-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A rbcp && git commit -q -m "RBCP: fotos guardadas" && git push -q origin HEAD:rbcp-inbox || echo "nada a guardar"
