name: YouTube CC scan (teste)
on:
  push:
    branches: [proto/yt-cc]
permissions:
  contents: read
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: Dados (repositório privado) + código (este repositório público)
        uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - run: rm -rf _engine/.git && tar -C _engine -cf - . | tar -xf - && echo "_engine/" >> .git/info/exclude
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Scan
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python yt_cc_scan.py
      - name: Save
        run: bash _engine/save_state.sh "YouTube CC scan" yt_cc.json
