name: Site check (teste)
on:
  push:
    branches: [proto/site-check]
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          S=https://beyond100tennis.com
          echo "== home"; curl -s -o /dev/null -w "%{http_code}\n" $S/
          echo "== bio claire-liu"; curl -s $S/p/claire-liu | grep -o "currently ranked No. 68[^<]*" | head -1
          echo "== torneio buenos-aires (antevisão)"; curl -s $S/t/buenos-aires | grep -o "<h2 class=\"dh\">Preview</h2><p>[^<]\{0,120\}" | head -1
          echo "== torneio montevideo (resumo)"; curl -s $S/t/montevideo | grep -o "About the [^<]*</h2><p>[^<]\{0,100\}" | head -1
          echo "== jogo antigo 220563 (noindex)"; curl -s $S/m/220563 | grep -o '<meta name=robots content=[^>]*>' | head -1
          echo "== sitemap tem m/220563?"; curl -s $S/sitemap.xml | grep -c "m/220563" || true
          echo "== sitemap total"; curl -s $S/sitemap.xml | grep -c "<loc>"
          echo "== jogo recente (index)"; curl -s $S/results | head -c 0; 
          echo "== admin"; curl -s -o /dev/null -w "%{http_code}\n" $S/admin/
          echo "== ig_status servido em público? (deve ser 404)"; curl -s -o /dev/null -w "%{http_code}\n" $S/ig_status.json
          echo "== bios.json público? (deve ser 404)"; curl -s -o /dev/null -w "%{http_code}\n" $S/bios.json
