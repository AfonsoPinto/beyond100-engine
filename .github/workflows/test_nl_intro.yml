name: Test newsletter intro (temporário)
on:
  push:
    branches: [ai/newsletter-intro]
    paths: [".github/workflows/test_nl_intro.yml"]  # 3
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: AfonsoPinto/beyond100, ref: main, token: "${{ secrets.DATA_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { path: _engine }
      - run: rm -rf _engine/.git && tar -C _engine -cf - . | tar -xf - && echo "_engine/" >> .git/info/exclude
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Abertura (vai só para o repositório privado, nada no registo)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python - <<'PY'
          import json, datetime as dt, newsletter, ai_texts
          out = {}
          sun = dt.date.today() - dt.timedelta(days=dt.date.today().weekday() + 1)
          for back in (0, 7, 14):
              d = newsletter._prep(newsletter.week_data(today=sun - dt.timedelta(days=back)))
              out[f"w{d['week']}"] = ai_texts.newsletter_intro(d)
          json.dump(out, open("nl_intro_test.json", "w"), ensure_ascii=False, indent=1)
          PY
          python -c "import json;print({k: bool(v) for k,v in json.load(open('nl_intro_test.json')).items()})"
          git config user.name AfonsoPinto && git config user.email 26894011+AfonsoPinto@users.noreply.github.com
          git add nl_intro_test.json && git commit -qm "teste: abertura da newsletter (temporário)" && for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
